name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsdl2-dev libpng-dev libvorbis-dev zlib1g-dev libboost-test-dev
      - name: Debug build and tests
        run: |
          cmake --preset debug
          cmake --build --preset debug --parallel 2
          ctest --preset debug
      - name: Release build and tests
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
          ctest --preset release
      - name: Legacy SDL2 build
        working-directory: sc2
        run: |
          printf '\n' | ./build.sh uqm -j2
          ./uqm-debug --version
